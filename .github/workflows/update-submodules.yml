name: Update Submodules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodules
        run: |
          # Configuramos para que confíe en el directorio (evita errores de permisos de Git)
          git config --global --add safe.directory '*'
          
          # Forzamos la actualización remota ignorando el historial local conflictivo
          git submodule update --init --recursive --remote --no-fetch
          git submodule foreach 'git fetch origin && git checkout main && git reset --hard origin/main'

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update submodules to latest commits"
            git push
          else
            echo "No hay cambios en los subrepositorios."
          fi
