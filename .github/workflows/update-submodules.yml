name: Update Submodules

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta cada día a las 00:00 UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la web

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Importante para que la Action pueda hacer 'push'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule update --init --recursive --remote --merge

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update submodules to latest commits"
            git push
          else
            echo "No hay cambios en los subrepositorios."
          fi
